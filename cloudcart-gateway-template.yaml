AWSTemplateFormatVersion: '2010-09-09'
Description: '[DEV] Unified API Gateway — single entry point for all CloudCart services'

Parameters:
  IncludeAgentRoute:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: "Wire up POST /agent/chat. Requires the cloudcart-agent-dev stack (deployed when GROQ_API_KEY is set)."

Conditions:
  HasAgentRoute: !Equals [!Ref IncludeAgentRoute, "true"]
  NoAgentRoute: !Not [!Condition HasAgentRoute]

Resources:

  ### REST API ###
  UnifiedApiDev:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: UnifiedApiDev

  ### Top-level resources ###
  ProductsResourceDev:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ParentId: !GetAtt UnifiedApiDev.RootResourceId
      PathPart: products

  CartResourceDev:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ParentId: !GetAtt UnifiedApiDev.RootResourceId
      PathPart: cart

  OrdersResourceDev:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ParentId: !GetAtt UnifiedApiDev.RootResourceId
      PathPart: orders

  AccountAuthResourceDev:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ParentId: !GetAtt UnifiedApiDev.RootResourceId
      PathPart: auth

  AccountAuthRegisterResourceDev:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ParentId: !Ref AccountAuthResourceDev
      PathPart: register

  AccountAuthLoginResourceDev:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ParentId: !Ref AccountAuthResourceDev
      PathPart: login

  ### /products/{id} and /products/{id}/stock ###
  ProductIdResourceDev:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ParentId: !Ref ProductsResourceDev
      PathPart: "{id}"

  ProductStockResourceDev:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ParentId: !Ref ProductIdResourceDev
      PathPart: stock

  ### /cart/{userId} and /cart/{userId}/{productId} ###
  CartUserIdResourceDev:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ParentId: !Ref CartResourceDev
      PathPart: "{userId}"

  CartProductIdResourceDev:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ParentId: !Ref CartUserIdResourceDev
      PathPart: "{productId}"

  ### /orders/{orderId} ###
  OrderByIdResourceDev:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ParentId: !Ref OrdersResourceDev
      PathPart: "{orderId}"

  ### /agent/chat ###
  AgentResourceDev:
    Condition: HasAgentRoute
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ParentId: !GetAtt UnifiedApiDev.RootResourceId
      PathPart: agent

  AgentChatResourceDev:
    Condition: HasAgentRoute
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ParentId: !Ref AgentResourceDev
      PathPart: chat

  ### Lambda permissions — allow UnifiedApiDev to invoke every function ###
  ListProductsPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue cloudcart-products-ListProductsFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApiDev}/*/*"

  CreateProductPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue cloudcart-products-CreateProductFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApiDev}/*/*"

  GetProductPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue cloudcart-products-GetProductFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApiDev}/*/*"

  UpdateStockPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue cloudcart-products-UpdateStockFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApiDev}/*/*"

  AddToCartPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue cloudcart-cart-AddToCartFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApiDev}/*/*"

  ViewCartPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue cloudcart-cart-ViewCartFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApiDev}/*/*"

  RemoveFromCartPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue cloudcart-cart-RemoveFromCartFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApiDev}/*/*"

  UpdateQuantityPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue cloudcart-cart-UpdateQuantityFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApiDev}/*/*"

  ClearCartPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue cloudcart-cart-ClearCartFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApiDev}/*/*"

  PlaceOrderPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue cloudcart-order-PlaceOrderFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApiDev}/*/*"

  GetOrderPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue cloudcart-order-GetOrderFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApiDev}/*/*"

  ListOrdersPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue cloudcart-order-ListOrdersFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApiDev}/*/*"

  AgentChatPermissionDev:
    Condition: HasAgentRoute
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue cloudcart-agent-AgentChatFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApiDev}/*/*"

  RegisterPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue cloudcart-auth-RegisterFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApiDev}/*/*"

  LoginPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue cloudcart-auth-LoginFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApiDev}/*/*"

  ### Methods — Products ###
  GetProductsMethodDev:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ResourceId: !Ref ProductsResourceDev
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ""
          - - "arn:aws:apigateway:"
            - !Ref AWS::Region
            - ":lambda:path/2015-03-31/functions/"
            - !ImportValue cloudcart-products-ListProductsFunctionArn
            - "/invocations"

  PostProductsMethodDev:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ResourceId: !Ref ProductsResourceDev
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ""
          - - "arn:aws:apigateway:"
            - !Ref AWS::Region
            - ":lambda:path/2015-03-31/functions/"
            - !ImportValue cloudcart-products-CreateProductFunctionArn
            - "/invocations"

  GetProductByIdMethodDev:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ResourceId: !Ref ProductIdResourceDev
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ""
          - - "arn:aws:apigateway:"
            - !Ref AWS::Region
            - ":lambda:path/2015-03-31/functions/"
            - !ImportValue cloudcart-products-GetProductFunctionArn
            - "/invocations"

  PatchStockMethodDev:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ResourceId: !Ref ProductStockResourceDev
      HttpMethod: PATCH
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ""
          - - "arn:aws:apigateway:"
            - !Ref AWS::Region
            - ":lambda:path/2015-03-31/functions/"
            - !ImportValue cloudcart-products-UpdateStockFunctionArn
            - "/invocations"

  ### Methods — Cart ###
  PostCartMethodDev:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ResourceId: !Ref CartResourceDev
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ""
          - - "arn:aws:apigateway:"
            - !Ref AWS::Region
            - ":lambda:path/2015-03-31/functions/"
            - !ImportValue cloudcart-cart-AddToCartFunctionArn
            - "/invocations"

  GetCartMethodDev:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ResourceId: !Ref CartUserIdResourceDev
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ""
          - - "arn:aws:apigateway:"
            - !Ref AWS::Region
            - ":lambda:path/2015-03-31/functions/"
            - !ImportValue cloudcart-cart-ViewCartFunctionArn
            - "/invocations"

  DeleteCartMethodDev:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ResourceId: !Ref CartProductIdResourceDev
      HttpMethod: DELETE
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ""
          - - "arn:aws:apigateway:"
            - !Ref AWS::Region
            - ":lambda:path/2015-03-31/functions/"
            - !ImportValue cloudcart-cart-RemoveFromCartFunctionArn
            - "/invocations"

  PatchCartMethodDev:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ResourceId: !Ref CartProductIdResourceDev
      HttpMethod: PATCH
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ""
          - - "arn:aws:apigateway:"
            - !Ref AWS::Region
            - ":lambda:path/2015-03-31/functions/"
            - !ImportValue cloudcart-cart-UpdateQuantityFunctionArn
            - "/invocations"

  DeleteCartUserMethodDev:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ResourceId: !Ref CartUserIdResourceDev
      HttpMethod: DELETE
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ""
          - - "arn:aws:apigateway:"
            - !Ref AWS::Region
            - ":lambda:path/2015-03-31/functions/"
            - !ImportValue cloudcart-cart-ClearCartFunctionArn
            - "/invocations"

  ### Methods — Orders (API key required) ###
  PostOrderMethodDev:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ResourceId: !Ref OrdersResourceDev
      HttpMethod: POST
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ""
          - - "arn:aws:apigateway:"
            - !Ref AWS::Region
            - ":lambda:path/2015-03-31/functions/"
            - !ImportValue cloudcart-order-PlaceOrderFunctionArn
            - "/invocations"

  ListOrdersMethodDev:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ResourceId: !Ref OrdersResourceDev
      HttpMethod: GET
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ""
          - - "arn:aws:apigateway:"
            - !Ref AWS::Region
            - ":lambda:path/2015-03-31/functions/"
            - !ImportValue cloudcart-order-ListOrdersFunctionArn
            - "/invocations"

  GetOrderMethodDev:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ResourceId: !Ref OrderByIdResourceDev
      HttpMethod: GET
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ""
          - - "arn:aws:apigateway:"
            - !Ref AWS::Region
            - ":lambda:path/2015-03-31/functions/"
            - !ImportValue cloudcart-order-GetOrderFunctionArn
            - "/invocations"

  ### Methods — Agent chat ###
  PostAgentChatMethodDev:
    Condition: HasAgentRoute
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ResourceId: !Ref AgentChatResourceDev
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ""
          - - "arn:aws:apigateway:"
            - !Ref AWS::Region
            - ":lambda:path/2015-03-31/functions/"
            - !ImportValue cloudcart-agent-AgentChatFunctionArn
            - "/invocations"

  ### Methods — Account auth ###
  PostRegisterMethodDev:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ResourceId: !Ref AccountAuthRegisterResourceDev
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ""
          - - "arn:aws:apigateway:"
            - !Ref AWS::Region
            - ":lambda:path/2015-03-31/functions/"
            - !ImportValue cloudcart-auth-RegisterFunctionArn
            - "/invocations"

  PostLoginMethodDev:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ResourceId: !Ref AccountAuthLoginResourceDev
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ""
          - - "arn:aws:apigateway:"
            - !Ref AWS::Region
            - ":lambda:path/2015-03-31/functions/"
            - !ImportValue cloudcart-auth-LoginFunctionArn
            - "/invocations"

  ### /search and /search/reindex ###
  SearchResourceDev:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ParentId: !GetAtt UnifiedApiDev.RootResourceId
      PathPart: search

  SearchReindexResourceDev:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ParentId: !Ref SearchResourceDev
      PathPart: reindex

  SearchProductsPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue cloudcart-search-SearchProductsFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApiDev}/*/*"

  BulkReindexPermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !ImportValue cloudcart-search-BulkReindexFunctionArn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${UnifiedApiDev}/*/*"

  ### Methods — Search ###
  GetSearchMethodDev:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ResourceId: !Ref SearchResourceDev
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ""
          - - "arn:aws:apigateway:"
            - !Ref AWS::Region
            - ":lambda:path/2015-03-31/functions/"
            - !ImportValue cloudcart-search-SearchProductsFunctionArn
            - "/invocations"

  PostReindexMethodDev:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref UnifiedApiDev
      ResourceId: !Ref SearchReindexResourceDev
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Join
          - ""
          - - "arn:aws:apigateway:"
            - !Ref AWS::Region
            - ":lambda:path/2015-03-31/functions/"
            - !ImportValue cloudcart-search-BulkReindexFunctionArn
            - "/invocations"

  ### Deployment & Stage ###
  # DependsOn can't reference a conditional resource, so there is one deployment per case.
  UnifiedApiDeploymentDev:
    Type: AWS::ApiGateway::Deployment
    Condition: NoAgentRoute
    DependsOn:
      - GetProductsMethodDev
      - PostProductsMethodDev
      - GetProductByIdMethodDev
      - PatchStockMethodDev
      - PostCartMethodDev
      - GetCartMethodDev
      - DeleteCartMethodDev
      - PatchCartMethodDev
      - DeleteCartUserMethodDev
      - PostOrderMethodDev
      - ListOrdersMethodDev
      - GetOrderMethodDev
      - GetSearchMethodDev
      - PostReindexMethodDev
      - PostRegisterMethodDev
      - PostLoginMethodDev
    Properties:
      RestApiId: !Ref UnifiedApiDev
      Description: "v4 - adds account auth endpoints"

  UnifiedApiDeploymentAgentDev:
    Type: AWS::ApiGateway::Deployment
    Condition: HasAgentRoute
    DependsOn:
      - GetProductsMethodDev
      - PostProductsMethodDev
      - GetProductByIdMethodDev
      - PatchStockMethodDev
      - PostCartMethodDev
      - GetCartMethodDev
      - DeleteCartMethodDev
      - PatchCartMethodDev
      - DeleteCartUserMethodDev
      - PostOrderMethodDev
      - ListOrdersMethodDev
      - GetOrderMethodDev
      - GetSearchMethodDev
      - PostReindexMethodDev
      - PostAgentChatMethodDev
      - PostRegisterMethodDev
      - PostLoginMethodDev
    Properties:
      RestApiId: !Ref UnifiedApiDev
      Description: "v4 - adds account auth endpoints (with agent route)"

  UnifiedApiStageDev:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref UnifiedApiDev
      DeploymentId: !If [HasAgentRoute, !Ref UnifiedApiDeploymentAgentDev, !Ref UnifiedApiDeploymentDev]
      StageName: dev

  ### Usage Plan for /orders endpoints — reuses the existing API key from the order stack ###
  UnifiedUsagePlanDev:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: UnifiedApiStageDev
    Properties:
      UsagePlanName: UnifiedUsagePlanDev
      ApiStages:
        - ApiId: !Ref UnifiedApiDev
          Stage: dev

  UnifiedUsagePlanKeyDev:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !ImportValue cloudcart-order-OrderApiKeyId
      KeyType: API_KEY
      UsagePlanId: !Ref UnifiedUsagePlanDev

Outputs:

  UnifiedApiEndpoint:
    Description: "[DEV] Unified API base URL"
    Value: !Sub "https://${UnifiedApiDev}.execute-api.${AWS::Region}.amazonaws.com/dev"

  UnifiedApiInternalUrl:
    Description: "Internal LocalStack URL for unified API (for frontend next.config.ts)"
    Value: !Sub "http://host.docker.internal:4566/restapis/${UnifiedApiDev}/dev/_user_request_"
    Export:
      Name: cloudcart-gateway-UnifiedApiInternalUrl
