server:
  port: 8090

# One JSON object per line (same keys as the Lambdas: timestamp, level, service, message) so Loki
# ingests framework logs and our request/response events uniformly.
logging:
  structured:
    format:
      console: logstash
    json:
      rename:
        "@timestamp": timestamp
      exclude: "@version,level_value"
      add:
        service: mcp-server

spring:
  ai:
    mcp:
      server:
        name: cloudcart-mcp-server
        version: 1.0.0
        protocol: STREAMABLE

cloudcart:
  unified-api-url: ${UNIFIED_API_URL:http://localhost:4566/restapis/local/dev/_user_request_}
  order-api-key: ${ORDER_API_KEY:cloudcart-dev-key-2024}
