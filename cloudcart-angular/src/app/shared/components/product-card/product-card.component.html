<article
  class="rounded-2xl overflow-hidden flex flex-col transition-all duration-200"
  [style.border]="hovered ? '1px solid ' + accentColor + '55' : '1px solid rgba(99,102,241,0.2)'"
  [style.boxShadow]="hovered ? '0 8px 32px rgba(0,0,0,0.6), 0 4px 12px rgba(0,0,0,0.4), 0 0 0 1px ' + accentColor + '25' : '0 4px 16px rgba(0,0,0,0.5)'"
  [style.transform]="hovered ? 'translateY(-4px)' : 'translateY(0)'"
  [style.background]="'rgba(30,27,75,0.65)'"
  (mouseenter)="hovered = true"
  (mouseleave)="hovered = false"
>
  <!-- Top accent stripe — category color -->
  <div
    class="h-1 w-full shrink-0"
    [style.background]="'linear-gradient(90deg, ' + accentColor + ', ' + accentColor + '66)'"
    aria-hidden="true"
  ></div>

  <!-- Image area -->
  <div
    class="relative h-48 overflow-hidden flex items-center justify-center"
    [style.background]="'linear-gradient(135deg, ' + accentColor + '22 0%, ' + accentColor + '0d 100%)'"
  >
    <!-- Product image -->
    <img
      [src]="imageUrl"
      [alt]="product.title"
      class="absolute inset-0 w-full h-full object-cover"
    />
    <!-- Placeholder icon (shown when no image) -->
    <svg
      *ngIf="false"
      class="w-14 h-14 opacity-20"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      viewBox="0 0 24 24"
      [style.color]="accentColor"
      aria-hidden="true"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10" />
    </svg>

    <!-- Stock badge -->
    <span
      class="absolute top-2.5 right-2.5 px-2.5 py-0.5 rounded-full text-xs font-bold"
      [style]="stockBadgeStyle"
      [attr.aria-label]="stock === 0 ? 'Out of stock' : stock + ' in stock'"
    >
      {{ stock === 0 ? 'Out of stock' : stock + ' left' }}
    </span>

    <!-- Category pill -->
    <span
      *ngIf="product.category"
      class="absolute bottom-2.5 left-2.5 px-2.5 py-0.5 rounded-full text-xs font-bold text-white"
      [style.background]="accentColor + 'cc'"
      style="backdrop-filter: blur(4px);"
    >
      {{ product.category }}
    </span>
  </div>

  <!-- Card body -->
  <div class="p-4 flex flex-col flex-1">
    <h3
      class="font-bold text-sm leading-snug flex-1 line-clamp-2 mb-3"
      style="color: #e0d9ff;"
    >
      {{ product.title }}
    </h3>

    <!-- Price row -->
    <div class="flex items-end justify-between mb-3">
      <p class="text-2xl font-black" [style.color]="accentColor">
        ${{ product.price.toFixed(2) }}
      </p>
      <p *ngIf="stock > 0 && stock <= 5" class="text-xs font-semibold" style="color: #fb923c;">
        Only {{ stock }} left!
      </p>
    </div>

    <!-- Error message -->
    <p *ngIf="addError" class="text-xs font-medium mb-2" style="color: #f87171;">{{ addError }}</p>

    <!-- Add to cart button -->
    <button
      (click)="onAddToCart()"
      [disabled]="stock === 0 || loading || !userId"
      class="w-full py-2.5 rounded-xl text-sm font-bold text-white transition-all duration-150 relative overflow-hidden"
      [style]="addButtonStyle"
      [attr.aria-label]="added ? 'Added to cart' : product.stock === 0 ? 'Out of stock' : 'Add ' + product.title + ' to cart'"
    >
      <!-- Added state -->
      <span *ngIf="added" class="flex items-center justify-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
        </svg>
        Added!
      </span>
      <!-- Loading state -->
      <span *ngIf="!added && loading" class="flex items-center justify-center gap-1.5">
        <span
          class="w-3.5 h-3.5 border-2 border-t-transparent rounded-full cc-spin inline-block"
          style="border-color: rgba(255,255,255,0.9);"
          aria-hidden="true"
        ></span>
        Adding&hellip;
      </span>
      <!-- Default state -->
      <span *ngIf="!added && !loading" class="flex items-center justify-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
        </svg>
        {{ stock === 0 ? 'Out of Stock' : !userId ? 'Set user ID first' : 'Add to Cart' }}
      </span>
    </button>
  </div>
</article>
