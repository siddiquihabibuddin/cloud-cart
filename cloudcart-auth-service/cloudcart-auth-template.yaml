AWSTemplateFormatVersion: '2010-09-09'
Description: '[DEV] Lambda functions with DynamoDB and REST API Gateway for user accounts (register/login)'

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
    Description: "Shared HS256 signing secret for JWTs issued here and verified by cart/order/agent services"

Resources:

  ### DynamoDB Table for Users ###
  UsersTableDev:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: UsersTableDev
      AttributeDefinitions:
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: email
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  ### IAM Role for Auth Lambdas ###
  AuthLambdaExecutionRoleDev:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AuthLambdaExecutionRoleDev
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DevUsersDynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                Resource: !GetAtt UsersTableDev.Arn

  ### Lambda Functions ###
  RegisterFunctionDev:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: RegisterFunctionDev
      Runtime: java21
      Handler: com.cloudcart.auth.handler.RegisterHandler::handleRequest
      Role: !GetAtt AuthLambdaExecutionRoleDev.Arn
      Code:
        S3Bucket: sid-mysourcecode
        S3Key: auth-service-1.0.0.jar
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTableDev
          JWT_SECRET: !Ref JwtSecret
          ENV: dev
          AWS_ENDPOINT_URL: http://host.docker.internal:4566

  LoginFunctionDev:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: LoginFunctionDev
      Runtime: java21
      Handler: com.cloudcart.auth.handler.LoginHandler::handleRequest
      Role: !GetAtt AuthLambdaExecutionRoleDev.Arn
      Code:
        S3Bucket: sid-mysourcecode
        S3Key: auth-service-1.0.0.jar
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTableDev
          JWT_SECRET: !Ref JwtSecret
          ENV: dev
          AWS_ENDPOINT_URL: http://host.docker.internal:4566

  ### Lambda Permissions for API Gateway ###
  RegisterInvokePermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref RegisterFunctionDev
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthApiDev}/*/*

  LoginInvokePermissionDev:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref LoginFunctionDev
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${AuthApiDev}/*/*

  ### REST API ###
  AuthApiDev:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: AuthApiDev

  ### Resources: /auth, /auth/register, /auth/login ###
  AuthResourceDev:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthApiDev
      ParentId: !GetAtt AuthApiDev.RootResourceId
      PathPart: auth

  AuthRegisterResourceDev:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthApiDev
      ParentId: !Ref AuthResourceDev
      PathPart: register

  AuthLoginResourceDev:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref AuthApiDev
      ParentId: !Ref AuthResourceDev
      PathPart: login

  ### Methods ###
  PostRegisterMethodDev:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthApiDev
      ResourceId: !Ref AuthRegisterResourceDev
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${RegisterFunctionDev.Arn}/invocations

  PostLoginMethodDev:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref AuthApiDev
      ResourceId: !Ref AuthLoginResourceDev
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LoginFunctionDev.Arn}/invocations

  ### Deployment & Stage ###
  AuthApiDeploymentDev:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - PostRegisterMethodDev
      - PostLoginMethodDev
    Properties:
      RestApiId: !Ref AuthApiDev

  AuthApiStageDev:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref AuthApiDev
      DeploymentId: !Ref AuthApiDeploymentDev
      StageName: dev

Outputs:

  DevAuthApiEndpoint:
    Description: "[DEV] Auth API base URL"
    Value: !Sub "https://${AuthApiDev}.execute-api.${AWS::Region}.amazonaws.com/dev"

  RegisterFunctionArn:
    Value: !GetAtt RegisterFunctionDev.Arn
    Export:
      Name: cloudcart-auth-RegisterFunctionArn

  LoginFunctionArn:
    Value: !GetAtt LoginFunctionDev.Arn
    Export:
      Name: cloudcart-auth-LoginFunctionArn
